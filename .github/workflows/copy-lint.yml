name: Copy lint

# Enforces the house copy rules on customer-facing code (Codex #49):
# no en/em-dashes, no AI-tell words. Comment-only lines are ignored.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  copy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run copy lint
        run: node _agent/copy_lint.mjs
