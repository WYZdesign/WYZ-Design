name: Monthly site audit

# Adopts the two living boardroom audits as a recurring operating system
# (board tasks #36/#37). On the 1st of each month it opens a single tracking
# issue with the review checklist; re-runs are idempotent (one open issue per
# month). Run it on demand from the Actions tab too.

on:
  schedule:
    - cron: "0 15 1 * *" # 1st of the month, 15:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-audit-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().toISOString().slice(0, 7);
            const title = `Monthly site audit - ${month}`;

            // Ensure the label exists (ignore "already exists" errors).
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: "audit" });
            } catch {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: "audit", color: "DF3131", description: "Recurring operating audits" });
              } catch {}
            }

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "audit", per_page: 50,
            });
            if (open.data.some((i) => i.title === title)) {
              core.info(`Issue already open: ${title}`);
              return;
            }

            const body = [
              "Monthly operating review. Work the two living audits and record evidence in the issue.",
              "",
              "**1. Boardroom audit** (`WYZDESIGN_5000_POINT_BOARDROOM_AUDIT.md`)",
              "- [ ] Re-score the 100 subcategories from current evidence (no assumed points)",
              "- [ ] Note deltas vs last month and the biggest revenue-blocking gap",
              "",
              "**2. Client-experience audit** (`WYZDESIGN_CLIENT_EXPERIENCE_AUDIT.md`)",
              "- [ ] Walk discovery -> delivery -> repeat for one real journey",
              "- [ ] Flag any broken promise on a customer-facing surface",
              "",
              "**3. Truth pass** (no placeholders/cosmetics)",
              "- [ ] Merch: order path works end to end (cart -> Stripe -> Printful -> confirmation)",
              "- [ ] Gift cards: buy -> code delivered -> redeem at checkout",
              "- [ ] Proof metrics on Home/About/Events consistent with real records",
              "- [ ] Community page stats match reality",
              "",
              "Open WYZ_AI_TASK_BOARD.md, close what is done, add what is new.",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["audit"],
            });
